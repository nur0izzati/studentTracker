<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard & gifBakery</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>

  <style>
    :root {
      --bg: #faf7f5;
      --card: #ffffff;
      --accent: #e8a598;
      --accent-hover: #d89386;
      --text: #4a403a;
      --border: #f0ece9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      margin-bottom: 1.5rem;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .upload-area {
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      background: #fffaf9;
      cursor: pointer;
      margin-bottom: 1rem;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 10px;
      margin-bottom: 1rem;
    }

    .preview-grid img {
      width: 100%;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }

    .balance-box {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38a169;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h2>💸 Money Tracker</h2>
      <p>Current Balance: <span class="balance-box" id="balanceDisplay">RM 0.00</span></p>
      
      <div>
        <input type="text" id="descInput" placeholder="Description (e.g. Food)">
        <input type="number" id="amountInput" placeholder="Amount (RM)">
        <button class="btn" onclick="addTransaction()">Add Expense</button>
      </div>

      <ul id="transactionList" style="margin-top: 1rem; padding-left: 1.2rem;"></ul>
    </div>

    <div class="card">
      <h2>🧁 gifBakery (PDF & GIF Generator)</h2>
      <p>Upload images to automatically generate a PDF document or animated GIF.</p>

      <div class="upload-area" onclick="document.getElementById('imageInput').click()">
        <span>📁 Click or drop images here</span>
        <input type="file" id="imageInput" multiple accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
      </div>

      <div class="preview-grid" id="imagePreview"></div>

      <div>
        <button class="btn" id="pdfBtn" onclick="generatePDF()" disabled>Export to PDF</button>
        <button class="btn" id="gifBtn" onclick="generateGIF()" disabled>Generate GIF</button>
      </div>

      <div id="outputResult" style="margin-top: 1rem;"></div>
    </div>
  </div>

  <script>
    // --- MONEY TRACKER LOGIC ---
    let totalBalance = 0;

    function addTransaction() {
      const desc = document.getElementById('descInput').value;
      const amount = parseFloat(document.getElementById('amountInput').value);

      if (!desc || isNaN(amount)) return;

      totalBalance += amount;
      document.getElementById('balanceDisplay').textContent = `RM ${totalBalance.toFixed(2)}`;

      const li = document.createElement('li');
      li.textContent = `${desc}: RM ${amount.toFixed(2)}`;
      document.getElementById('transactionList').appendChild(li);

      document.getElementById('descInput').value = '';
      document.getElementById('amountInput').value = '';
    }

    // --- GIF & PDF LOGIC ---
    let uploadedImages = [];

    function handleImageUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      uploadedImages = [];
      const previewContainer = document.getElementById('imagePreview');
      previewContainer.innerHTML = '';

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedImages.push(e.target.result);
          
          const img = document.createElement('img');
          img.src = e.target.result;
          previewContainer.appendChild(img);

          document.getElementById('pdfBtn').disabled = false;
          document.getElementById('gifBtn').disabled = false;
        };
        reader.readAsDataURL(file);
      });
    }

    function generatePDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();

      uploadedImages.forEach((imgData, index) => {
        if (index > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 15, 15, 180, 160);
      });

      pdf.save('document.pdf');
    }

    function generateGIF() {
      const outputResult = document.getElementById('outputResult');
      outputResult.innerHTML = '<p>Generating GIF... Please wait.</p>';

      gifshot.createGIF({
        images: uploadedImages,
        interval: 0.5,
        gifWidth: 250,
        gifHeight: 250
      }, function(obj) {
        if (!obj.error) {
          const animatedImage = obj.image;
          outputResult.innerHTML = `
            <img src="${animatedImage}" style="border-radius: 8px;" /><br><br>
            <a href="${animatedImage}" download="animation.gif" class="btn">Download GIF</a>
          `;
        } else {
          outputResult.innerHTML = '<p>Error creating GIF.</p>';
        }
      });
    }
  </script>
</body>
</html>
