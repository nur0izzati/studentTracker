<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Life Hub - Assignments, Budget & gifBakery</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>

  <style>
    :root {
      --bg: #faf7f5;
      --card: #ffffff;
      --accent: #e8a598;
      --accent-hover: #d89386;
      --text: #4a403a;
      --border: #f0ece9;
      --sage: #b3c8b9;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    /* Navigation Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: #8c827a;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards & Components */
    .card {
      background: var(--card);
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      margin-bottom: 1.5rem;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    input, select {
      padding: 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    /* Assignment Tracker Styles */
    .assignment-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .badge.high { background: #fed7d7; color: #9b2c2c; }
    .badge.medium { background: #feebc8; color: #9c4221; }
    .badge.low { background: #c6f6d5; color: #22543d; }

    /* gifBakery Upload Area */
    .upload-area {
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      background: #fffaf9;
      cursor: pointer;
      margin-bottom: 1rem;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-bottom: 1rem;
    }

    .preview-grid img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 style="text-align: center;">🎓 Student Life Suite</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('assignments')">📚 Assignments</button>
      <button class="tab-btn" onclick="switchTab('budget')">💸 Money Tracker</button>
      <button class="tab-btn" onclick="switchTab('gifbakery')">🧁 gifBakery (GIF & PDF)</button>
    </div>

    <div id="assignments" class="tab-content active">
      <div class="card">
        <h2>Assignment Tracker</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;">
          <input type="text" id="taskTitle" placeholder="Assignment Title">
          <input type="text" id="taskSubject" placeholder="Course / Subject">
          <input type="date" id="taskDueDate">
          <select id="taskPriority">
            <option value="Low">Low Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="High">High Priority</option>
          </select>
          <button class="btn" onclick="addAssignment()">Add Task</button>
        </div>
        <div id="assignmentList"></div>
      </div>
    </div>

    <div id="budget" class="tab-content">
      <div class="card">
        <h2>Money Tracker</h2>
        <h3 style="color: #38a169;">Balance: <span id="balanceDisplay">RM 0.00</span></h3>
        <div style="margin-bottom: 1rem;">
          <input type="text" id="descInput" placeholder="Description (e.g. Books)">
          <input type="number" id="amountInput" placeholder="Amount (RM)">
          <select id="typeInput">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
          <button class="btn" onclick="addTransaction()">Add Entry</button>
        </div>
        <ul id="transactionList" style="padding-left: 1.2rem;"></ul>
      </div>
    </div>

    <div id="gifbakery" class="tab-content">
      <div class="card">
        <h2>🧁 gifBakery Generator</h2>
        <p>Convert uploaded images into a PDF document or animated GIF automatically.</p>

        <div class="upload-area" onclick="document.getElementById('imageInput').click()">
          <span>📁 Click or drop images here</span>
          <input type="file" id="imageInput" multiple accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
        </div>

        <div class="preview-grid" id="imagePreview"></div>

        <div>
          <button class="btn" id="pdfBtn" onclick="generatePDF()" disabled>Export to PDF</button>
          <button class="btn" id="gifBtn" onclick="generateGIF()" disabled>Generate GIF</button>
        </div>

        <div id="outputResult" style="margin-top: 1.5rem;"></div>
      </div>
    </div>
  </div>

  <script>
    // TAB SWITCHING LOGIC
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // ASSIGNMENT TRACKER LOGIC
    let assignments = JSON.parse(localStorage.getItem('assignments')) || [];

    function renderAssignments() {
      const container = document.getElementById('assignmentList');
      container.innerHTML = '';
      assignments.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'assignment-item';
        div.innerHTML = `
          <div>
            <strong>${item.title}</strong> (${item.subject})<br>
            <small>Due: ${item.dueDate || 'N/A'}</small>
          </div>
          <div>
            <span class="badge ${item.priority.toLowerCase()}">${item.priority}</span>
            <button onclick="deleteAssignment(${index})" style="background:none; border:none; color:red; cursor:pointer; margin-left:10px;">✕</button>
          </div>
        `;
        container.appendChild(div);
      });
      localStorage.setItem('assignments', JSON.stringify(assignments));
    }

    function addAssignment() {
      const title = document.getElementById('taskTitle').value;
      const subject = document.getElementById('taskSubject').value;
      const dueDate = document.getElementById('taskDueDate').value;
      const priority = document.getElementById('taskPriority').value;

      if (!title) return;
      assignments.push({ title, subject, dueDate, priority });
      renderAssignments();
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskSubject').value = '';
    }

    function deleteAssignment(index) {
      assignments.splice(index, 1);
      renderAssignments();
    }

    // MONEY TRACKER LOGIC
    let balance = parseFloat(localStorage.getItem('balance')) || 0;

    function updateBalanceDisplay() {
      document.getElementById('balanceDisplay').textContent = `RM ${balance.toFixed(2)}`;
      localStorage.setItem('balance', balance);
    }

    function addTransaction() {
      const desc = document.getElementById('descInput').value;
      const amount = parseFloat(document.getElementById('amountInput').value);
      const type = document.getElementById('typeInput').value;

      if (!desc || isNaN(amount)) return;

      if (type === 'income') {
        balance += amount;
      } else {
        balance -= amount;
      }

      updateBalanceDisplay();

      const li = document.createElement('li');
      li.textContent = `${desc}: ${type === 'income' ? '+' : '-'} RM ${amount.toFixed(2)}`;
      document.getElementById('transactionList').appendChild(li);

      document.getElementById('descInput').value = '';
      document.getElementById('amountInput').value = '';
    }

    // GIF & PDF GENERATOR LOGIC
    let uploadedImages = [];

    function handleImageUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      uploadedImages = [];
      const previewContainer = document.getElementById('imagePreview');
      previewContainer.innerHTML = '';

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedImages.push(e.target.result);
          const img = document.createElement('img');
          img.src = e.target.result;
          previewContainer.appendChild(img);

          document.getElementById('pdfBtn').disabled = false;
          document.getElementById('gifBtn').disabled = false;
        };
        reader.readAsDataURL(file);
      });
    }

    function generatePDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();

      uploadedImages.forEach((imgData, index) => {
        if (index > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 15, 15, 180, 160);
      });

      pdf.save('document.pdf');
    }

    function generateGIF() {
      const outputResult = document.getElementById('outputResult');
      outputResult.innerHTML = '<p>Generating GIF... Please wait.</p>';

      gifshot.createGIF({
        images: uploadedImages,
        interval: 0.5,
        gifWidth: 250,
        gifHeight: 250
      }, function(obj) {
        if (!obj.error) {
          const animatedImage = obj.image;
          outputResult.innerHTML = `
            <img src="${animatedImage}" style="border-radius: 8px;" /><br><br>
            <a href="${animatedImage}" download="animation.gif" class="btn">Download GIF</a>
          `;
        } else {
          outputResult.innerHTML = '<p>Error creating GIF.</p>';
        }
      });
    }

    // Initial Load
    renderAssignments();
    updateBalanceDisplay();
  </script>
</body>
</html>
