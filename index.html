<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gifBakery - Converter Tool</title>
  <style>
    :root {
      --bg: #faf7f5;
      --card: #ffffff;
      --accent: #e8a598;
      --accent-hover: #d89386;
      --text: #4a403a;
      --border: #f0ece9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    p {
      color: #8c827a;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .upload-area {
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      background: #fffaf9;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin: 0.25rem;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .preview-grid img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .output-section {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .output-preview {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 1rem;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>🧁 gifBakery Generator</h1>
    <p>Upload multiple images to convert them into a PDF or animated GIF automatically.</p>

    <div class="upload-area" onclick="document.getElementById('imageInput').click()">
      <span>📁 Click or drop images here</span>
      <input type="file" id="imageInput" multiple accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
    </div>

    <div class="preview-grid" id="imagePreview"></div>

    <div style="text-align: center;">
      <button class="btn" id="pdfBtn" onclick="generatePDF()" disabled>Export PDF</button>
      <button class="btn" id="gifBtn" onclick="generateGIF()" disabled>Generate GIF</button>
    </div>

    <div class="output-section" id="outputSection" style="display: none;">
      <h3>Result Preview</h3>
      <div id="gifResult"></div>
    </div>
  </div>

  <script>
    let uploadedImages = [];

    function handleImageUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      uploadedImages = [];
      const previewContainer = document.getElementById('imagePreview');
      previewContainer.innerHTML = '';

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedImages.push(e.target.result);
          
          const img = document.createElement('img');
          img.src = e.target.result;
          previewContainer.appendChild(img);

          // Enable buttons once images are loaded
          document.getElementById('pdfBtn').disabled = false;
          document.getElementById('gifBtn').disabled = false;
        };
        reader.readAsDataURL(file);
      });
    }

    // Generate PDF from Uploaded Images
    function generatePDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();

      uploadedImages.forEach((imgData, index) => {
        if (index > 0) pdf.addPage();
        // Add image to page (X, Y, Width, Height)
        pdf.addImage(imgData, 'JPEG', 15, 15, 180, 160);
      });

      pdf.save('gifBakery-document.pdf');
    }

    // Generate Animated GIF from Uploaded Images
    function generateGIF() {
      const outputSection = document.getElementById('outputSection');
      const gifResult = document.getElementById('gifResult');
      gifResult.innerHTML = '<p>Baking GIF... Please wait.</p>';
      outputSection.style.display = 'block';

      gifshot.createGIF({
        images: uploadedImages,
        interval: 0.5, // speed in seconds per frame
        gifWidth: 300,
        gifHeight: 300
      }, function(obj) {
        if (!obj.error) {
          const animatedImage = obj.image;
          gifResult.innerHTML = `
            <img src="${animatedImage}" class="output-preview" /><br><br>
            <a href="${animatedImage}" download="gifBakery-anim.gif" class="btn">Download GIF</a>
          `;
        } else {
          gifResult.innerHTML = '<p>Error creating GIF. Try smaller images.</p>';
        }
      });
    }
  </script>
</body>
</html>
